name: Recolectar y predecir

# Cada 10 minutos (guía operativa v2.0): recoge el lote, descubre el ciclo, predice y envía.
# Los ciclos abren una vez por hora con una ventana de 25 minutos, y el cron de GitHub puede
# retrasarse varios minutos; despertar cada 10 min da ~3 oportunidades dentro de cada ventana.
# Despertar tres veces no significa enviar tres veces: si ya hay un recibo aceptado para el
# ciclo, `pulso.predict` termina en verde sin reenviar. La API decide siempre (ciclo y closes_at).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Una sola ejecución a la vez: evita entregas duplicadas para el mismo ciclo.
concurrency:
  group: collect-and-predict
  cancel-in-progress: false

jobs:
  run:
    # Los disparos programados solo corren si el repositorio define PIPELINE_ENABLED=true
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Cubre la espera dentro de la ventana (50 min) más la instalación.
    timeout-minutes: 65
    env:
      PULSO_API_URL: ${{ vars.PULSO_API_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Recolectar observaciones nuevas
        run: python -m pulso.ingest
      # Si al despertar no hay ciclo abierto, el job espera hasta 50 minutos a que abra uno, en vez
      # de rendirse: los cron de GitHub se retrasan y se saltan ejecuciones, así que basta con que
      # arranque UNA ejecución por hora para cubrir la ventana. Vuelve a sincronizar justo antes de
      # entregar, porque entre despertar y entregar la API libera datos nuevos.
      - name: Esperar el ciclo, predecir y enviar
        run: python -m pulso.predict --wait-for-cycle 50
