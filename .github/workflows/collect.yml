name: Recolectar datos

# Recolector dedicado: su única tarea es traer las observaciones nuevas del stream y guardarlas en
# Supabase. Vive aparte de la predicción y del monitoreo para que un fallo en esos no corte la
# memoria de datos (separación de responsabilidades de la guía operativa v2.0).
#
# Sobre la cadencia: el objetivo es recolectar al menos una vez por hora. Se pide cada 20 minutos
# porque GitHub descarta buena parte de las ejecuciones programadas (medido: 6 de ~31 con cron
# horario), así que un cron horario a secas daría huecos de varias horas. Repetir es inofensivo:
# el upsert es idempotente y el cursor solo avanza tras confirmar la escritura.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos recolectores a la vez: evita que dos ejecuciones avancen el cursor en paralelo.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PULSO_API_URL: ${{ vars.PULSO_API_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      # Termina en verde si no hay novedades; deja constancia en `ingestion_runs` de todos modos.
      - name: Recolectar observaciones nuevas
        run: python -m pulso.ingest
