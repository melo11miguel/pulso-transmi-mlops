[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-mlops"
version = "0.1.0"
description = "Sistema MLOps para el reto Pulso TransMi: collector, modelos, inferencia y monitoreo"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4",
]

[project.optional-dependencies]
eda = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Las reglas (PromotionRules, RetrainRules) son dataclasses inmutables: seguras como valor por defecto.
extend-immutable-calls = ["pulso.policy.PromotionRules", "pulso.policy.RetrainRules"]
